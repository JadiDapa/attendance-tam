name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Shadow DB kosong untuk `db:check-drift` (migrasi diputar ulang di sini,
      # lalu dibandingkan dengan schema.prisma) dan server untuk `test:int`.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tanpa DATABASE_URL, prisma.config.ts memakai URL placeholder —
      # `generate` tidak pernah konek.
      - run: npx prisma generate
      # `check` menyertakan `test:int`, yang membuat & menghapus database
      # sementara di server Postgres ini (scripts/with-temp-db.mjs).
      - run: npm run check
        env:
          TEMP_DATABASE_SERVER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Schema dan migrasi sinkron
        run: npm run db:check-drift
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
